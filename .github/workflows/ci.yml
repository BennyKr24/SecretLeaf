name: CI


on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint web
        run: npm run lint --workspace @secretleaf/web

      - name: Typecheck web
        run: npm run typecheck --workspace @secretleaf/web

      - name: Build web
        run: npm run build --workspace @secretleaf/web
