name: CI


on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: i18n content coverage
        # Fails if any DE content string (wiki / diagnostics / diagnose-tree)
        # has no EN translation in the committed translation memories.
        # After merging new DE articles: `npm run i18n:translate`.
        run: npm run i18n:check

      - name: i18n glossary lint
        # Advisory: prints EN translations that drop a do-not-translate term
        # (THC, VPD, genus names, …). Never fails the build.
        run: npm run i18n:glossary-lint

      - name: Typecheck web
        run: npm run typecheck --workspace @secretleaf/web

      - name: Build web
        run: npm run build --workspace @secretleaf/web
